{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Chat</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white h-screen flex">

  <!-- Sidebar -->
  <div class="w-1/4 bg-gray-800 p-4 border-r border-gray-700">
    <h2 class="text-xl font-bold mb-4">Chats</h2>

    <div class="space-y-2">
      <div class="p-3 bg-gray-700 rounded-xl cursor-pointer hover:bg-gray-600">
        # general
      </div>
      <div class="p-3 bg-gray-700 rounded-xl cursor-pointer hover:bg-gray-600">
        # random
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="flex-1 flex flex-col">

    <!-- Header -->
    <div class="p-4 border-b border-gray-700 flex items-center justify-between">
      <h2 class="font-semibold text-lg"># general</h2>
      <span class="text-sm text-green-400">● Online</span>
    </div>

    <!-- Messages -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <!-- Input -->
    <div class="p-4 border-t border-gray-700 flex gap-2">
      <input
        id="message-input"
        type="text"
        placeholder="Type a message..."
        class="flex-1 p-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none"
      />

      <button
  onclick="sendMessage()"
  class="bg-blue-600 px-5 py-3 rounded-xl hover:bg-blue-500"
>
  
      
      >
        Send
      </button>
    </div>

  </div>

  <!-- JS -->
  <script src="{% static 'chat/app.js' %}"></script>

</body>
</html>
